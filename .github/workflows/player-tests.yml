name: Player regression tests

on:
  push:
    branches:
      - main
      - improve/mobile-stream-resilience
      - fix/android-chrome-native-hls-misreport
      - fix/android-startup-stage-and-play
      - fix/android-hls-startup-diagnostics
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check player.js
          node --check sw.js
          node --check tests/run-tests.mjs
      - name: EriTV regression suite (both playback engines)
        run: node tests/run-tests.mjs
      - name: Inspect live HLS playlist and browser CORS headers (informational)
        continue-on-error: true
        run: |
          curl -sSL --connect-timeout 5 --max-time 15 -H 'Origin: https://euphgd-ctrl.github.io' -D /tmp/eritv-headers -o /tmp/eritv-manifest 'https://jmc-live.ercdn.net/eritreatv/eritreatv.m3u8'
          echo '--- HTTP and CORS headers ---'
          grep -Ei '^(HTTP/|access-control-|content-type:|cache-control:)' /tmp/eritv-headers || true
          echo '--- Manifest preview (first 20 lines) ---'
          head -20 /tmp/eritv-manifest || true
          echo '--- 720p playlist response and first segments ---'
          curl -sSL --connect-timeout 5 --max-time 15 -H 'Origin: https://euphgd-ctrl.github.io' -D /tmp/eritv-720-headers -o /tmp/eritv-720.m3u8 'https://jmc-live.ercdn.net/eritreatv/eritreatv_720p.m3u8'
          grep -Ei '^(HTTP/|access-control-|content-type:|cache-control:)' /tmp/eritv-720-headers || true
          head -24 /tmp/eritv-720.m3u8 || true
          segment=$(grep -v '^#' /tmp/eritv-720.m3u8 | grep -v '^
 | head -1)
          if [ -n "$segment" ]; then
            case "$segment" in https://*) segment_url="$segment" ;; *) segment_url="https://jmc-live.ercdn.net/eritreatv/$segment" ;; esac
            echo '--- First listed segment headers ---'
            curl -sSL -I --connect-timeout 5 --max-time 15 -H 'Origin: https://euphgd-ctrl.github.io' "$segment_url" | grep -Ei '^(HTTP/|access-control-|content-type:|content-length:|cache-control:)' || true
          fi
