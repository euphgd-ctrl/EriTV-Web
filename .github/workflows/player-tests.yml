name: Player regression tests

on:
  push:
    branches:
      - main
      - improve/mobile-stream-resilience
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check player.js
          node --check sw.js
          node --check tests/run-tests.mjs
      - name: EriTV regression suite (both playback engines)
        run: node tests/run-tests.mjs
