name: Official Eritrea flag icons
on:
  push:
    branches: [fix/official-eritrea-flag-icons]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install cairosvg pillow
      - run: python scripts/generate_flag_icons.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icons/
          if ! git diff --cached --quiet; then
            git commit -m 'Replace all icon PNGs with official Eritrean flag'
            git push
          fi
